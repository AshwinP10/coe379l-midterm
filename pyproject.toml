[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-lab-agent"
version = "0.1.0"
description = "Typed tool-using agent for a fictional shared laboratory"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
live = ["httpx>=0.27,<1"]

[project.scripts]
atlas-demo-tools = "atlas_agent.demo_tools:main"
atlas-evaluate-scripted = "atlas_agent.public_benchmark:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agent"]
